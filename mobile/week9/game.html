<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽돌 깨기</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 p-4 text-white grid place-items-center">
<main class="w-full max-w-3xl">
  <h1 class="mb-4 text-3xl font-black">벽돌 깨기</h1>
  <div class="mb-3 flex gap-6 text-lg font-bold"><span>점수 <b id="score">0</b></span><span>목숨 <b id="lives">3</b></span></div>
  <div class="relative overflow-hidden rounded-2xl border border-slate-700">
    <canvas id="game" width="800" height="520" class="block w-full touch-none bg-slate-900"></canvas>
    <div id="cover" class="absolute inset-0 grid place-items-center bg-slate-950/75 text-center">
      <div><h2 id="title" class="text-3xl font-black">벽돌 깨기</h2><p id="message" class="my-3 text-slate-300">시작을 눌러 플레이하세요.</p>
        <button id="start" class="rounded-xl bg-cyan-400 px-6 py-3 font-bold text-slate-950">게임 시작</button></div>
    </div>
  </div>
  <p class="mt-3 text-center text-sm text-slate-400">마우스·터치 또는 ← → 키로 패들 이동 · Space 일시정지</p>
</main>
<script>
// c는 게임 캔버스, x는 그림을 그리는 도구, $는 id로 HTML 요소를 찾는 짧은 함수입니다.
const c=document.querySelector("#game"),x=c.getContext("2d"),$=s=>document.querySelector(s);
// 게임 내부 좌표는 캔버스 크기(800×520) 기준입니다. 화면에 맞춰 보여도 내부 좌표는 바뀌지 않습니다.
// p는 패들, b는 공이며 속도(vx, vy)는 초당 이동 픽셀입니다.
const W=c.width,H=c.height,p={x:344,y:485,w:112,h:14},b={x:400,y:460,r:8,vx:210,vy:-300};
// bricks는 벽돌 목록, keys는 현재 눌린 키, state는 게임 상태, last/raf는 애니메이션 시간 관리용입니다.
let bricks=[],score=0,lives=3,state="ready",keys={},last=0,raf;
// 공과 패들을 시작 위치로 돌리고, 공을 왼쪽 또는 오른쪽으로 출발시킵니다.
function reset(){p.x=344;b.x=400;b.y=460;b.vx=210*(Math.random()<.5?-1:1);b.vy=-300}
// 5행×8열 벽돌을 만들고, 행마다 색을 다르게 지정합니다. on이 false가 되면 화면에서 사라집니다.
function init(){bricks=[];for(let r=0;r<5;r++)for(let q=0;q<8;q++)bricks.push({x:39+q*92,y:65+r*32,w:82,h:22,on:true,color:["#22d3ee","#38bdf8","#818cf8","#a78bfa","#f472b6"][r]})}
// 캔버스를 지운 뒤 벽돌, 패들, 공을 현재 좌표에 다시 그립니다.
function draw(){
  x.clearRect(0,0,W,H);
  bricks.forEach(t=>{if(t.on){x.fillStyle=t.color;x.beginPath();x.roundRect(t.x,t.y,t.w,t.h,5);x.fill()}});
  x.fillStyle="#a5f3fc";x.beginPath();x.roundRect(p.x,p.y,p.w,p.h,7);x.fill();
  x.fillStyle="white";x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();
}
// 게임 시작·일시정지·종료 안내를 표시합니다.
function overlay(title,msg,button="게임 시작"){ $("#title").textContent=title;$("#message").textContent=msg;$("#start").textContent=button;$("#cover").classList.remove("hidden") }
// 게임을 시작하거나 멈춘 게임을 이어갑니다. 새 게임이면 점수/목숨/벽돌도 초기화합니다.
function begin(){
  if(state==="ready"||state==="over"||state==="won"){score=0;lives=3;init();reset();$("#score").textContent=score;$("#lives").textContent=lives}
  state="play";$("#cover").classList.add("hidden");last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)
}
// 모든 벽돌을 깼거나 목숨을 잃었을 때 결과 화면을 표시합니다.
function end(won){state=won?"won":"over";overlay(won?"모두 깼어요!":"게임 오버",`최종 점수: ${score}`,"다시 시작")}
// 한 프레임 동안 위치와 충돌을 계산합니다. dt는 프레임 사이의 초 단위 시간입니다.
function step(dt){
  // 키 입력에 따라 패들을 움직이고, 캔버스 밖으로 나가지 않게 제한합니다.
  if(keys.ArrowLeft)p.x-=420*dt;if(keys.ArrowRight)p.x+=420*dt;p.x=Math.max(0,Math.min(W-p.w,p.x));
  // 속도 × 시간만큼 공을 이동합니다.
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  // 좌우 벽과 위쪽 벽에 부딪히면 공의 진행 방향을 반대로 바꿉니다.
  if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(b.y<b.r)b.vy=Math.abs(b.vy);
  // 패들에 맞은 위치에 따라 공의 튕기는 각도가 달라집니다.
  if(b.vy>0&&b.y+b.r>=p.y&&b.x>=p.x&&b.x<=p.x+p.w){let a=(b.x-p.x-p.w/2)/(p.w/2)*1.05;b.vx=370*Math.sin(a);b.vy=-370*Math.cos(a)}
  // 공과 겹친 벽돌 하나를 찾아 제거하고 점수를 올립니다.
  let t=bricks.find(t=>t.on&&b.x+b.r>t.x&&b.x-b.r<t.x+t.w&&b.y+b.r>t.y&&b.y-b.r<t.y+t.h);
  if(t){t.on=false;b.vy*=-1;score+=10;$("#score").textContent=score}
  if(bricks.every(t=>!t.on)){end(true);return}
  if(b.y>H){lives--;$("#lives").textContent=lives;if(!lives){end(false);return}reset();state="life";overlay("한 번 더!",`남은 목숨: ${lives}`,"계속하기");return}
  draw()
}
// 브라우저 화면이 갱신될 때마다 호출되어 게임을 부드럽게 진행합니다.
function loop(time){if(state!=="play")return;let dt=last?Math.min((time-last)/1000,.03):0;last=time;step(dt);if(state==="play")raf=requestAnimationFrame(loop)}
// 시작/계속하기 버튼을 누르면 게임을 실행합니다.
$("#start").onclick=()=>begin();
// 마우스나 터치 위치를 캔버스 좌표로 바꿔 패들을 따라 움직입니다.
$("#game").onpointermove=e=>{let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(W-p.w,(e.clientX-r.left)*W/r.width-p.w/2));if(state!=="play")draw()};
// 방향키로 패들을 조작하고 Space로 게임을 시작하거나 일시정지/재개합니다.
window.onkeydown=e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key===" "?"Space":e.key]=true;if(e.code==="Space"){if(state==="play"){state="pause";overlay("일시정지","계속하려면 Space 또는 버튼을 누르세요.","계속하기")}else if(state==="pause"||state==="ready"||state==="life")begin()}};
// 키를 놓으면 해당 방향 입력을 해제합니다.
window.onkeyup=e=>keys[e.key===" "?"Space":e.key]=false;
// 페이지를 열면 벽돌과 공을 준비하고 첫 화면을 그립니다.
init();reset();draw();
</script>
</body>
</html>
