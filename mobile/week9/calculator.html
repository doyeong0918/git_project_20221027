<!doctype html>
<html lang="ko">
<head>
  <!-- 한글 표시와 모바일 화면 크기를 설정하고 계산기 스타일과 동작 파일을 연결합니다. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>계산기</title>
  <link rel="stylesheet" href="calculator.css">
  <script src="calculator.js" defer></script>
</head>
<body>
  <!-- 계산기의 제목, 화면, 버튼을 한곳에 묶는 바깥 영역입니다. -->
  <main class="calculator" aria-label="계산기">
    <!-- 계산기 제목 영역입니다. -->
    <header class="calculator-header">
      <p class="eyebrow">간단하고 빠른</p>
      <h1>계산기</h1>
    </header>

    <!-- 계산 결과를 보여주는 화면입니다. 아래 숫자와 결과는 JavaScript가 갱신합니다. -->
    <section class="display" aria-label="계산 결과">
      <!-- 연산자를 누른 뒤 이전 숫자와 연산자를 표시합니다. -->
      <p id="previous-value" class="previous-value" aria-hidden="true"></p>
      <!-- 현재 입력 중인 숫자 또는 계산 결과를 표시합니다. -->
      <output id="current-value" class="current-value" aria-live="polite" aria-atomic="true">0</output>
    </section>

    <!-- 버튼은 data-digit, data-operator, data-action 값을 통해 JavaScript 동작과 연결됩니다. -->
    <section class="keypad" aria-label="계산기 버튼">
      <!-- 초기화와 마지막 글자 삭제 버튼입니다. -->
      <button class="key key-utility" type="button" data-action="clear" aria-label="모두 지우기">AC</button>
      <button class="key key-utility" type="button" data-action="delete" aria-label="마지막 숫자 지우기">DEL</button>
      <!-- 나누기와 곱하기 연산자 버튼입니다. -->
      <button class="key key-operator" type="button" data-operator="÷" aria-label="나누기">÷</button>
      <button class="key key-operator" type="button" data-operator="×" aria-label="곱하기">×</button>

      <!-- 숫자 7~9와 빼기 버튼입니다. -->
      <button class="key" type="button" data-digit="7">7</button>
      <button class="key" type="button" data-digit="8">8</button>
      <button class="key" type="button" data-digit="9">9</button>
      <button class="key key-operator" type="button" data-operator="-" aria-label="빼기">−</button>

      <!-- 숫자 4~6과 더하기 버튼입니다. -->
      <button class="key" type="button" data-digit="4">4</button>
      <button class="key" type="button" data-digit="5">5</button>
      <button class="key" type="button" data-digit="6">6</button>
      <button class="key key-operator" type="button" data-operator="+" aria-label="더하기">+</button>

      <!-- 숫자 1~3과 계산 실행 버튼입니다. -->
      <button class="key" type="button" data-digit="1">1</button>
      <button class="key" type="button" data-digit="2">2</button>
      <button class="key" type="button" data-digit="3">3</button>
      <button class="key key-equals" type="button" data-action="equals" aria-label="계산하기">=</button>

      <!-- 0 버튼은 두 칸을 차지하며, 소수점 버튼은 소수 입력을 시작합니다. -->
      <button class="key key-zero" type="button" data-digit="0">0</button>
      <button class="key" type="button" data-action="decimal" aria-label="소수점">.</button>
    </section>

    <!-- 지원하는 키보드 입력 방법을 안내합니다. -->
    <p class="keyboard-hint">키보드의 숫자와 + − * / Enter 키도 사용할 수 있어요.</p>
  </main>
</body>
</html>
