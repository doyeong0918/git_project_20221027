<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헌혈나눔 - 혈액 현황</title>
<link rel="stylesheet" href="css/style.css?v=20261118b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="js/supabase-config.js?v=20261118b" defer></script>
<script src="js/common.js?v=20261118b" defer></script>
<script src="js/auth.js?v=20261118b" defer></script>
<script src="js/db.js?v=20261118b" defer></script>
<script src="js/data.js?v=20261118b" defer></script>
<script src="js/status.js?v=20261118b" defer></script>
</head>
<body data-page="status">

<main class="page">
  <div class="content">

    <section id="stock">
      <h2>혈액형별 보유량</h2>
      <div class="notice" style="margin-bottom:1.2rem">
        <strong>안내</strong> · 대한적십자사 혈액관리본부가 발표한 혈액형별 보유일수를 관리자가 옮겨 적은 값이에요.
        기준일을 꼭 확인하고, 가장 최신 수치는 <a href="#official">공식 사이트</a>에서 확인하세요.
      </div>
      <div class="mytype-row">
        <label for="my-type">내 혈액형</label>
        <select id="my-type">
          <option value="">선택 안 함</option>
          <option value="A">A형</option>
          <option value="B">B형</option>
          <option value="O">O형</option>
          <option value="AB">AB형</option>
        </select>
        <span id="my-type-msg"></span>
      </div>
      <div id="stock-dash" class="dash"></div>
      <div class="legend" aria-label="단계 기준">
        <span style="--c:var(--lv1)">적정 · 5일분 이상</span>
        <span style="--c:var(--lv2)">관심 · 5일분 미만</span>
        <span style="--c:var(--lv3)">주의 · 3일분 미만</span>
        <span style="--c:var(--lv4)">경계 · 2일분 미만</span>
        <span style="--c:var(--lv5)">심각 · 1일분 미만</span>
      </div>
      <p class="hint">단계 기준은 혈액관리본부의 혈액수급 위기단계(관심·주의·경계·심각)를 따랐어요.</p>
    </section>

    <section id="official">
      <h2>공식 현황 보기</h2>
      <div class="ref-site-list">
        <a class="ref-site-card" href="https://www.bloodinfo.net/knrcbs/bi/info/bldHoldSttus.do?mi=1046" target="_blank" rel="noopener">
          <div class="ref-site-name">혈액정보 (대한적십자사 혈액관리본부)</div>
          <div class="ref-site-desc">혈액형별 실시간 보유 현황과 헌혈 안내를 제공하는 공식 사이트.</div>
        </a>
      </div>
    </section>

  </div>
</main>

</body>
</html>
